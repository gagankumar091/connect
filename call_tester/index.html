<!DOCTYPE html>
<html>
<head>
    <title>Mitron Web Caller Tester</title>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #f0f2f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .video-container { display: flex; gap: 20px; margin-top: 20px; }
        .video-box { width: 100%; height: 300px; background: #333; border-radius: 8px; overflow: hidden; position: relative; }
        .video-box span { position: absolute; bottom: 10px; left: 10px; color: white; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px; z-index: 10; }
        input, button { padding: 10px; margin: 5px; border-radius: 6px; border: 1px solid #ccc; }
        button { background: #4F46E5; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #4338ca; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .danger { background: #ef4444; }
        .danger:hover { background: #dc2626; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Mitron Call Tester (Web)</h2>
        <p>Use this interface to test audio/video calls against your Android device.</p>
        
        <div>
            <input type="text" id="channelName" placeholder="Enter Channel Name (e.g. call_userA_userB)" style="width: 300px;">
            <input type="text" id="callerId" placeholder="Your UID (e.g. 101)">
            <input type="text" id="receiverId" placeholder="Receiver UID (e.g. 102)">
            <br><br>
            <button id="joinBtn" onclick="joinCall()">Join Video Call</button>
            <button id="leaveBtn" class="danger" onclick="leaveCall()" disabled>Leave Call</button>
        </div>

        <div class="video-container">
            <div id="local-player" class="video-box"><span>Local Video</span></div>
            <div id="remote-player" class="video-box"><span>Remote Video</span></div>
        </div>
    </div>

    <script>
        const APP_ID = "d5d98935c72d46a68385409d52c31ad9";
        // Connect to your local backend or vercel URL for tokens
        const BACKEND_URL = "https://connect-mitron.vercel.app"; 
        
        const client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
        let localTracks = { videoTrack: null, audioTrack: null };
        let remoteUsers = {};

        async function fetchToken(channelName, callerId, receiverId) {
            try {
                // Adjust this to hit your exact backend endpoint for tokens
                const response = await fetch(`${BACKEND_URL}/api/calls/token`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer MITRON_SECURE_KEY_2026'
                    },
                    body: JSON.stringify({
                        uid: parseInt(callerId),
                        role: 'publisher',
                        channelName: channelName
                    })
                });
                const data = await response.json();
                return data.token; // Ensure this matches your backend response format
            } catch (error) {
                console.error("Error fetching token:", error);
                alert("Could not fetch token from backend. Make sure backend is running on localhost:3000");
                return null;
            }
        }

        async function joinCall() {
            const channelName = document.getElementById("channelName").value;
            const callerId = document.getElementById("callerId").value || Math.floor(Math.random() * 10000);
            const receiverId = document.getElementById("receiverId").value || 9999;

            if (!channelName) { alert("Please enter a channel name!"); return; }

            document.getElementById("joinBtn").disabled = true;

            try {
                // 1. Fetch Token from Backend
                const token = await fetchToken(channelName, callerId, receiverId);
                
                // If backend requires token but you don't have it running, you can test with null if app certificate is disabled on Agora Dashboard.
                // const token = null;

                // 2. Join the Agora Channel
                const uid = await client.join(APP_ID, channelName, token, parseInt(callerId));

                // 3. Create local audio/video tracks
                localTracks.audioTrack = await AgoraRTC.createMicrophoneAudioTrack();
                localTracks.videoTrack = await AgoraRTC.createCameraVideoTrack();

                // 4. Play local video
                localTracks.videoTrack.play("local-player");

                // 5. Publish local tracks to channel
                await client.publish(Object.values(localTracks));

                document.getElementById("leaveBtn").disabled = false;
                console.log("Successfully joined call!");
            } catch (error) {
                console.error(error);
                alert("Failed to join call. See console.");
                document.getElementById("joinBtn").disabled = false;
            }
        }

        async function leaveCall() {
            for (trackName in localTracks) {
                var track = localTracks[trackName];
                if (track) {
                    track.stop();
                    track.close();
                    localTracks[trackName] = null;
                }
            }
            await client.leave();
            document.getElementById("remote-player").innerHTML = "<span>Remote Video</span>";
            document.getElementById("joinBtn").disabled = false;
            document.getElementById("leaveBtn").disabled = true;
            console.log("Left call");
        }

        // Handle remote users joining
        client.on("user-published", async (user, mediaType) => {
            await client.subscribe(user, mediaType);
            console.log("Subscribed to remote user:", user.uid);

            if (mediaType === "video") {
                const remoteVideoTrack = user.videoTrack;
                remoteVideoTrack.play("remote-player");
            }
            if (mediaType === "audio") {
                const remoteAudioTrack = user.audioTrack;
                remoteAudioTrack.play();
            }
        });

        // Handle remote users leaving
        client.on("user-unpublished", user => {
            console.log("Remote user unpublished:", user.uid);
            document.getElementById("remote-player").innerHTML = "<span>Remote Video</span>";
        });
    </script>
</body>
</html>
