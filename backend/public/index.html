<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitron Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .delete-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .delete-btn:hover { background: #dc2626; }
    </style>
</head>
<body>
    <div class="glow-bg"></div>
    <div class="dashboard-container">
        <aside class="sidebar glass-panel">
            <h1 class="logo">Mitron<span class="gradient-text">.Admin</span></h1>
            <nav>
                <a href="#" class="nav-item active" onclick="showTab('users', event)">Live Users</a>
                <a href="#" class="nav-item" onclick="showTab('events', event)">Events</a>
                <a href="#" class="nav-item" onclick="showTab('companies', event)">Companies</a>
                <a href="#" class="nav-item" onclick="showTab('add-user', event)">+ Add Employee</a>
                <a href="#" class="nav-item" onclick="showTab('add-company', event)">+ Add Company</a>
                <a href="#" class="nav-item" onclick="showTab('add-event', event)">+ Add Event</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar glass-panel">
                <h2>Admin Control Panel</h2>
            </header>

            <div id="users-tab" class="tab-content active">
                <h2 class="section-title">Manage Users</h2>
                <div class="glass-panel table-container">
                    <table class="data-table">
                        <thead><tr><th>Name</th><th>Email</th><th>Company</th><th>Actions</th></tr></thead>
                        <tbody id="users-table-body"></tbody>
                    </table>
                </div>
            </div>

            <div id="events-tab" class="tab-content">
                <h2 class="section-title">Manage Events</h2>
                <div class="glass-panel table-container">
                    <table class="data-table">
                        <thead><tr><th>Title</th><th>Location</th><th>Date</th><th>Actions</th></tr></thead>
                        <tbody id="events-table-body"></tbody>
                    </table>
                </div>
            </div>

            <div id="companies-tab" class="tab-content">
                <h2 class="section-title">Manage Companies</h2>
                <div class="glass-panel table-container">
                    <table class="data-table">
                        <thead><tr><th>Name</th><th>Descriptor</th><th>Employees</th><th>Actions</th></tr></thead>
                        <tbody id="companies-table-body"></tbody>
                    </table>
                </div>
            </div>

            <div id="add-user-tab" class="tab-content">
                <h2 class="section-title">Add Employee</h2>
                <div class="glass-panel form-container">
                    <form id="user-form">
                        <div class="form-group"><label>Name</label><input type="text" id="usr-name" required></div>
                        <div class="form-group"><label>Email</label><input type="email" id="usr-email" required></div>
                        <div class="form-group"><label>Company Name</label><input type="text" id="usr-comp" required></div>
                        <div class="form-group"><label>Job Title</label><input type="text" id="usr-title" required></div>
                        <button type="submit" class="btn-primary">Add Employee</button>
                    </form>
                </div>
            </div>

            <div id="add-company-tab" class="tab-content">
                <h2 class="section-title">Add Company</h2>
                <div class="glass-panel form-container">
                    <form id="company-form">
                        <div class="form-group"><label>Company Name</label><input type="text" id="comp-name" required></div>
                        <div class="form-group"><label>Descriptor (e.g. B2B SaaS)</label><input type="text" id="comp-desc" required></div>
                        <div class="form-group"><label>Employees Count</label><input type="number" id="comp-emp" required></div>
                        <button type="submit" class="btn-primary">Add Company</button>
                    </form>
                </div>
            </div>

            <div id="add-event-tab" class="tab-content">
                <h2 class="section-title">Broadcast New Event</h2>
                <div class="glass-panel form-container">
                    <form id="event-form">
                        <div class="form-group"><label>Event Title</label><input type="text" id="ev-title" required></div>
                        <div class="form-group"><label>Location Name</label><input type="text" id="ev-loc" required></div>
                        <div class="form-group"><label>Date & Time</label><input type="text" id="ev-date" required></div>
                        <div style="display: flex; gap: 10px;">
                            <div class="form-group" style="flex: 1;"><label>Latitude</label><input type="number" step="any" id="ev-lat" required></div>
                            <div class="form-group" style="flex: 1;"><label>Longitude</label><input type="number" step="any" id="ev-lng" required></div>
                        </div>
                        <div class="form-group"><label>Description</label><textarea id="ev-desc" rows="3" required></textarea></div>
                        <div class="form-group">
                            <label>Attendees (Hold Ctrl/Cmd to select multiple)</label>
                            <select id="ev-attendees" multiple style="height: 120px; width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border);"></select>
                        </div>
                        <button type="submit" class="btn-primary">Broadcast Event</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
